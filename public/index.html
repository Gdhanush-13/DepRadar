<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Overfetch — REST vs GraphQL</title><style>body{font:16px system-ui;max-width:960px;margin:4rem auto;padding:0 1rem;background:#101827;color:#eef2ff}a,button{color:#67e8f9}table{width:100%;border-collapse:collapse}td,th{padding:1rem;border-bottom:1px solid #334155;text-align:left}.bar{height:1rem;background:#22d3ee}</style><h1>Overfetch</h1><p>REST vs GraphQL. Same data. Real numbers, not opinions.</p><label>Scenario <select id="scenario"><option value="homepage-feed">Homepage feed</option><option value="deep-thread">Deep comment thread</option><option value="search-pagination">Paginated search</option></select></label> <button id="run">Run benchmark</button><section id="out"></section><script>run.onclick=async()=>{out.textContent='Measuring…';const r=await fetch('/benchmark/'+scenario.value);const x=await r.json();out.innerHTML='<h2>'+x.scenario+'</h2><table><tr><th>API</th><th>Requests</th><th>Bytes</th><th>Time (ms)</th></tr><tr><td>REST</td><td>'+x.rest.requests+'</td><td>'+x.rest.bytes+'</td><td>'+x.rest.milliseconds+'</td></tr><tr><td>GraphQL</td><td>'+x.graphql.requests+'</td><td>'+x.graphql.bytes+'</td><td>'+x.graphql.milliseconds+'</td></tr></table><p>Database queries: '+x.databaseQueries.dataloaderEnabled+'</p><div class="bar" style="width:'+Math.min(100,x.rest.bytes/Math.max(x.rest.bytes,x.graphql.bytes)*100)+'%"></div>'}</script></html>
