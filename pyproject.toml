[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depradar"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0", "aiosqlite>=0.20", "httpx>=0.27", "jinja2>=3.1", "pydantic-settings>=2.5", "python-multipart>=0.0.9", "packaging>=24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]
production = ["asyncpg>=0.29"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
ignore = ["B008", "BLE001"]
[tool.mypy]
strict = false
ignore_missing_imports = true
[tool.setuptools.packages.find]
include = ["app*"]
