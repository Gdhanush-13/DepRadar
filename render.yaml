services:
  - type: web
    name: overfetch
    env: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OVERFETCH_ENV
        value: production
      - key: AUTH_SECRET
        sync: false
      - key: DATALOADER_ENABLED
        value: "true"
