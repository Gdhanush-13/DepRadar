services:
  app: {build: ., ports: ["8000:8000"], environment: {DATABASE_URL: postgresql+asyncpg://depradar:depradar@postgres/depradar, REDIS_URL: redis://redis:6379/0}, depends_on: [postgres, redis]}
  worker: {build: ., command: celery -A app.worker.celery_app worker --loglevel=info, environment: {DATABASE_URL: postgresql+asyncpg://depradar:depradar@postgres/depradar, REDIS_URL: redis://redis:6379/0}, depends_on: [postgres, redis]}
  beat: {build: ., command: celery -A app.worker.celery_app beat --loglevel=info, environment: {DATABASE_URL: postgresql+asyncpg://depradar:depradar@postgres/depradar, REDIS_URL: redis://redis:6379/0}, depends_on: [postgres, redis]}
  postgres: {image: postgres:16-alpine, environment: {POSTGRES_USER: depradar, POSTGRES_PASSWORD: depradar, POSTGRES_DB: depradar}, volumes: [pgdata:/var/lib/postgresql/data]}
  redis: {image: redis:7-alpine}
volumes: {pgdata: {}}
