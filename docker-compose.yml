services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://depradar:depradar@postgres/depradar
    depends_on:
      - postgres
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: depradar
      POSTGRES_PASSWORD: depradar
      POSTGRES_DB: depradar
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
