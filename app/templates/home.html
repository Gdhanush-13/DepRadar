<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DepRadar · dependency health</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-950 text-slate-100 min-h-screen"><main class="max-w-5xl mx-auto px-6 py-20"><p class="text-cyan-400 font-semibold tracking-widest uppercase">Dependency health radar</p><h1 class="text-5xl md:text-7xl font-black mt-4 leading-tight">Know when your<br><span class="text-cyan-400">dependencies drift.</span></h1><p class="mt-6 text-xl text-slate-300 max-w-2xl">DepRadar scans public GitHub repositories for stale, archived, and vulnerable packages—then turns the signal into a badge your README can wear.</p><form class="mt-10 flex max-w-xl gap-3" action="/scan" method="post"><input name="repo" required placeholder="owner/repo" class="flex-1 rounded-xl bg-slate-800 border border-slate-700 px-5 py-4 outline-none focus:border-cyan-400"><button class="rounded-xl bg-cyan-400 text-slate-950 font-bold px-6">Scan repo</button></form><div class="grid md:grid-cols-3 gap-4 mt-20"><div class="rounded-2xl bg-slate-900 p-6"><div class="text-3xl">100</div><div class="text-slate-400 mt-2">Freshness signal</div></div><div class="rounded-2xl bg-slate-900 p-6"><div class="text-3xl">4 APIs</div><div class="text-slate-400 mt-2">GitHub · PyPI · npm · OSV</div></div><div class="rounded-2xl bg-slate-900 p-6"><div class="text-3xl">SVG</div><div class="text-slate-400 mt-2">Drop-in README badge</div></div></div></main></body></html>
