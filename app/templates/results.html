<!doctype html><html lang="en"><head><meta charset="utf-8"><script src="https://cdn.tailwindcss.com"></script><title>Scan results · DepRadar</title></head><body class="bg-slate-950 text-slate-100 min-h-screen"><main class="max-w-4xl mx-auto px-6 py-16"><a class="text-cyan-400" href="/">← New scan</a><h1 class="text-4xl font-bold mt-8">{{ repo }}</h1><div class="grid md:grid-cols-2 gap-5 mt-8"><div class="rounded-2xl bg-slate-900 p-8"><div class="text-slate-400">Freshness score</div><div class="text-6xl text-cyan-400 font-black mt-2">{{ '%.0f'|format(scan.freshness_score) }}</div></div><div class="rounded-2xl bg-slate-900 p-8"><div class="text-slate-400">Risk score</div><div class="text-6xl text-amber-400 font-black mt-2">{{ '%.0f'|format(scan.risk_score) }}</div></div></div><p class="mt-8 text-slate-400">Badge: <code>/badge/{{ repo }}.svg</code></p></main></body></html>
